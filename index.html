<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Client-only Old School RuneScape tools: money makers and Sotetseg maze trainer." />
	<title>Old School RuneScape tools</title>
	<link rel="icon" type="image/png" href="public/osrs-logo.png" />

	<main class="home">
